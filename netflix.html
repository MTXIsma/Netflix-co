<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IswoxX | Movie Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { background-color: #0c0c0c; color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; }
        .netflix-card { background: rgba(255,255,255,0.01); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; transition: 0.3s; }
        .netflix-card:hover { border-color: #e50914; box-shadow: 0 0 30px rgba(229, 9, 20, 0.1); }
        .btn-netflix { background: #e50914; color: white; font-weight: 700; padding: 12px; width: 100%; border-radius: 10px; text-align: center; display: inline-block; }
    </style>
</head>
<body>
    <main class="max-w-4xl mx-auto px-6 py-24 text-center">
        <h1 class="text-5xl font-black mb-16">Cinema <span class="text-red-600">Home</span></h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <div class="netflix-card p-10 text-left">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" class="h-8 mb-8" alt="Netflix">
                <h3 class="text-xl font-bold mb-2">Netflix Premium 4K</h3>
                <p class="text-gray-500 mb-8">Compte privé ou partagé selon stock. Qualité Ultra HD.</p>
                <div class="text-3xl font-black mb-8">1,20€</div>
                <a href="https://discord.gg/3qd3ptx8" class="btn-netflix italic">COMMANDER</a>
            </div>

            <div class="netflix-card p-10 text-left" style="hover:border-color:#00a8e1">
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/11/Amazon_Prime_Video_logo.svg" class="h-8 mb-8" alt="Prime">
                <h3 class="text-xl font-bold mb-2">Amazon Prime Video</h3>
                <p class="text-gray-500 mb-8">Accès complet au catalogue Prime et Ligue 1.</p>
                <div class="text-3xl font-black mb-8">1,69€</div>
                <a href="https://discord.gg/3qd3ptx8" class="bg-blue-500 text-white font-bold py-3 rounded-xl text-center block italic">COMMANDER</a>
            </div>
        </div>
        
        <div class="mt-20">
            <a href="index.html" class="text-gray-600 hover:text-white transition underline underline-offset-8">Retourner à la boutique</a>
        </div>
    </main>
</body>
</html>
